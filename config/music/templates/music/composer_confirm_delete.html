{% extends "base.html" %}

{% block title %}Удалить композитора — World Of Music{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-danger">Удалить композитора?</h3>
        <p class="mt-3">Вы уверены, что хотите удалить "{{ object }}"?</p>

        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'music:composer_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
