{% extends "base.html" %}

{% block content %}
<h2>Удалить назначение?</h2>

<p>Вы уверены, что хотите удалить назначение №{{ object.pk }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
</form>

<a href="{% url 'assignment_detail' object.pk %}">Отмена</a>
{% endblock %}
