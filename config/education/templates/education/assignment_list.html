{% extends "base.html" %}

{% block content %}
<h2>Назначения</h2>

<ul>
    {% for a in assignments %}
        <li>
            <a href="{% url 'assignment_detail' a.pk %}">
                {{ a.teacher }} → {{ a.student }} ({{ a.subject }})
            </a>
        </li>
    {% endfor %}
</ul>

<a href="{% url 'assignment_create' %}">Создать назначение</a>
{% endblock %}
