{% extends "base.html" %}

{% block content %}
<h2>Вход</h2>

<form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger">
            {% for error in form.non_field_errors %}
                {{ error }}
            {% endfor %}
        </div>
    {% endif %}

    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Войти</button>
</form>

<hr>
<p>Ещё нет аккаунта?</p>
<a href="{% url 'student_register' %}">Регистрация ученика</a> ·
<a href="{% url 'teacher_register' %}">Регистрация педагога</a>

{% endblock %}
