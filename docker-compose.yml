services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wom_db
      POSTGRES_USER: wom_user
      POSTGRES_PASSWORD: qwer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wom_user"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./config:/app/config
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: wom_db
      POSTGRES_USER: wom_user
      POSTGRES_PASSWORD: qwer
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: