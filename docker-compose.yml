services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wom_db
      POSTGRES_USER: wom_user
      POSTGRES_PASSWORD: qwer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wom_user -d wom_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    # Монтируем папку config внутрь контейнера как /app
    volumes:
      - ./config:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: wom_db
      POSTGRES_USER: wom_user
      POSTGRES_PASSWORD: qwer
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: