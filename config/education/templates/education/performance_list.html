{% extends "base.html" %}

{% block content %}
<h2>Исполнения</h2>

<ul>
    {% for p in performances %}
        <li>
            <a href="{% url 'education:performance_detail' p.pk %}">
                Исполнение №{{ p.pk }} — {{ p.assignment.student }} ({{ p.assignment.subject }})
            </a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
