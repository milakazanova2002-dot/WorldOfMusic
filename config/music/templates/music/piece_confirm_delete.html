{% extends "base.html" %}

{% block title %}Удалить произведение — World Of Music{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card p-4 shadow-sm" style="max-width: 500px;">
        <h3 class="text-danger">Удалить произведение?</h3>
        <p class="mt-3">Вы уверены, что хотите удалить "{{ object }}"?</p>
        <p class="text-muted small">Все материалы, связанные с этим произведением, также будут удалены.</p>

        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'music:piece_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
