{% extends "base.html" %}

{% block title %}Удалить материал{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card p-4 shadow-sm">
        <h2>Удалить материал?</h2>
        <p>Вы уверены, что хотите удалить материал «{{ object.get_type_display }}{% if object.description %} — {{ object.description }}{% endif %}»?</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'music:piece_detail' object.piece.pk %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
