{% extends "base.html" %}

{% block title %}Настройки ученика — World Of Music{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Настройки ученика</h2>

    <div class="card p-4 mt-3 shadow-sm" style="max-width: 600px;">
        <form method="post">
            {% csrf_token %}

            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-bold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|join:", " }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'accounts:profile_edit' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
