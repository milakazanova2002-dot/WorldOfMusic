{% extends "base.html" %}

{% block title %}Смена пароля — World Of Music{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Смена пароля</h2>
        <p class="auth-subtitle">Введите старый и новый пароль</p>

        <form method="post">
            {% csrf_token %}
            {% include "accounts/_form_fields.html" %}
            <button type="submit" class="btn btn-primary">Сохранить новый пароль</button>
        </form>

        <p class="auth-switch">
            <a href="{% url 'accounts:account_menu' %}">Отмена</a>
        </p>
    </div>
</div>
{% endblock %}
